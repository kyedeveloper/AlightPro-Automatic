<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alight Pro Hub | System Login</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">

  <style>
    :root { 
      --bg-color: #020617; 
      --card-bg: rgba(15, 23, 42, 0.6); 
      --primary: #00ff88; 
      --text-main: #f8fafc; 
      --text-muted: #94a3b8; 
      --border: rgba(0, 255, 136, 0.2); 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      position: relative;
      overflow: hidden;
    }

    /* CYBER GRID BACKGROUND */
    body::before {
      content: ''; 
      position: absolute; 
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
      background-size: 40px 40px; 
      z-index: -1;
      mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    }

    /* ANIMASI GRADIENT CAHAYA */
    .glow-blob {
      position: absolute;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,255,136,0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: pulseGlow 4s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    /* MODAL ERROR */
    .custom-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 100000; padding: 20px; }
    .modal-content { background: #0f172a; border: 1px solid #ff3366; border-radius: 22px; padding: 30px 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 25px rgba(255, 51, 102, 0.15); animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* AUTH CARD UTAMA */
    .auth-wrapper {
      width: 100%;
      max-width: 380px;
      position: relative;
    }

    /* SERVER STATUS BADGE */
    .server-status {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: #020617;
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-family: 'Fira Code', monospace;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary);
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* CARD STYLE */
    .auth-card { 
      background: var(--card-bg); 
      padding: 50px 30px 35px; 
      border-radius: 24px; 
      border: 1px solid var(--border); 
      text-align: center; 
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 255, 136, 0.05); 
    }
    
    .auth-icon { 
      width: 75px; height: 75px; 
      margin: 0 auto 20px; 
      background: rgba(0, 255, 136, 0.05); 
      border-radius: 20px; 
      display: flex; align-items: center; justify-content: center; 
      border: 1px solid rgba(0, 255, 136, 0.3); 
      transform: rotate(45deg);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.1);
    }
    .auth-icon i { 
      font-size: 32px; 
      color: var(--primary); 
      transform: rotate(-45deg); /* balikin icon biar tegak */
    }

    .auth-card h2 { color: var(--text-main); font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
    .auth-card p { color: var(--primary); font-size: 11px; font-weight: 600; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; }
    
    /* INPUT GROUP TERBARU */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    .input-group i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      transition: 0.3s;
    }
    .modern-input { 
      width: 100%; 
      padding: 16px 16px 16px 45px; /* Kasih ruang buat icon di kiri */
      border-radius: 14px; 
      border: 1px solid rgba(255,255,255,0.1); 
      background: rgba(0,0,0,0.4); 
      color: #fff; 
      font-size: 15px; 
      outline: none; 
      transition: 0.3s; 
      font-family: 'Fira Code', monospace;
      letter-spacing: 2px;
    }
    .modern-input:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 20px rgba(0,255,136,0.15); 
      background: rgba(0,0,0,0.6);
    }
    .modern-input:focus + i, .modern-input:valid + i {
      color: var(--primary); /* Icon berubah warna pas diketik */
    }

    .modern-btn { 
      width: 100%; padding: 16px; border-radius: 14px; border: none; 
      background: var(--primary); color: #000; font-weight: 800; font-size: 15px; 
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; 
      transition: 0.2s; box-shadow: 0 5px 20px rgba(0,255,136,0.3); 
    }
    .modern-btn:active { transform: scale(0.96); }
    .modern-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* INFO BAWAH KARTU */
    .footer-info {
      margin-top: 25px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer-info i { color: var(--primary); opacity: 0.7;}
  </style>
</head>
<body>

  <!-- Efek Cahaya Latar -->
  <div class="glow-blob"></div>

  <!-- Modal Error PIN -->
  <div id="pinErrorModal" class="custom-modal">
    <div class="modal-content">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ff3366; margin-bottom: 15px;"></i>
      <h3 style="color: #ff3366; margin-bottom: 10px; font-weight: 800;">Akses Ditolak!</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">PIN yang kamu masukkan tidak valid atau telah kedaluwarsa.</p>
      <button class="modern-btn" style="background: #ff3366; color: #fff; box-shadow: 0 5px 20px rgba(255, 51, 102, 0.3);" onclick="closeModal()">Coba Lagi</button>
    </div>
  </div>

  <!-- Kartu Login Utama -->
  <div class="auth-wrapper">
    <!-- Status Server -->
    <div class="server-status">
      <div class="status-dot"></div>
      SYS.SERVER: ONLINE
    </div>

    <div class="auth-card">
      <div class="auth-icon"><i class="fa-solid fa-user-astronaut"></i></div>
      <h2>SYSTEM LOGIN</h2>
      <p>Alight Pro Core V4.0</p>
      
      <!-- Input Group Keren -->
      <div class="input-group">
        <input type="password" id="pinInput" class="modern-input" placeholder="ENTER PIN..." autocomplete="off" required>
        <i class="fa-solid fa-lock"></i>
      </div>

      <!-- Tombol dengan ID untuk Efek Loading -->
      <button id="loginBtn" class="modern-btn" onclick="executeLogin()">
        <i class="fa-solid fa-fingerprint"></i> Autentikasi Sistem
      </button>

      <!-- Keamanan Bawah -->
      <div class="footer-info">
        <i class="fa-solid fa-shield-halved"></i> 256-bit Encrypted Connection
      </div>
    </div>
  </div>

  <script>
    function executeLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('loginBtn');
      
      // Memicu Efek Loading Buatan (Biar Keren)
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...`;
      
      // Jeda 1.2 Detik sebelum ngecek PIN
      setTimeout(() => {
        if (pin === "990055" || pin === "0000" || pin === "visitor") {
          let role = "VISITOR";
          if (pin === "990055") role = "ADMINISTRATOR";
          if (pin === "0000") role = "MEMBER";
          
          sessionStorage.setItem('alightRole', role);
          window.location.href = 'home.html';
        } else {
          // Jika Gagal
          document.getElementById('pinErrorModal').style.display = 'flex';
          
          // Balikin Tombol
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-fingerprint"></i> Autentikasi Sistem`;
        }
      }, 1200); // 1200ms delay
    }

    function closeModal() { 
      document.getElementById('pinErrorModal').style.display = 'none';
      document.getElementById('pinInput').value = ''; // Reset inputan setelah salah
      document.getElementById('pinInput').focus();
    }
    
    // Bisa tekan 'Enter' di keyboard buat login
    document.getElementById("pinInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        executeLogin();
      }
    });
  </script>
</body>
</html>
