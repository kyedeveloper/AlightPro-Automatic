<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alight Pro Hub | Login</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #020617;
      --card-bg: rgba(15, 23, 42, 0.75);
      --primary: #00ff88;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg-color); color: var(--text-main); 
      height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
    }

    .custom-modal {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 100000; padding: 20px;
    }
    .modal-content {
      background: #0f172a; border: 1px solid #ff3366; border-radius: 22px;
      padding: 30px 24px; width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 25px rgba(255, 51, 102, 0.15);
    }

    .auth-card {
      background: var(--card-bg); padding: 40px 30px; border-radius: 24px;
      border: 1px solid rgba(0, 255, 136, 0.3); width: 100%; max-width: 380px;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(0, 255, 136, 0.1);
    }
    
    .auth-icon {
      width: 70px; height: 70px; margin: 0 auto 20px; background: rgba(0, 255, 136, 0.1);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(0, 255, 136, 0.4);
    }
    .auth-icon i { font-size: 30px; color: var(--primary); }

    .auth-card h2 { color: var(--text-main); font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
    .auth-card p { color: var(--primary); font-size: 12px; font-weight: 600; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }

    .modern-input {
      width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: #fff;
      font-size: 15px; outline: none; transition: 0.3s;
    }
    .modern-input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0,255,136,0.2); background: rgba(0,0,0,0.8); }
    
    .modern-btn {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: var(--primary); color: #000; font-weight: 800; font-size: 15px;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
      transition: 0.2s; box-shadow: 0 5px 20px rgba(0,255,136,0.3);
    }
    .modern-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <!-- MODAL ERROR PIN -->
  <div id="pinErrorModal" class="custom-modal">
    <div class="modal-content">
      <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ff3366; margin-bottom: 15px;"></i>
      <h3 style="color: #ff3366; margin-bottom: 10px; font-weight: 800;">Akses Ditolak!</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">PIN yang kamu masukkan tidak terdaftar di sistem. Silakan periksa kembali.</p>
      <button class="modern-btn" style="background: #ff3366; color: #fff;" onclick="closeModal()">Coba Lagi</button>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>Alight Login</h2>
    <p>System Authentication V4.0</p>
    
    <input type="password" id="pinInput" class="modern-input" placeholder="Masukkan PIN Akses..." autocomplete="off">
    <button class="modern-btn" onclick="executeLogin()">
      <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
  </div>

  <script>
    function executeLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      
      if (pin === "990055" || pin === "0000" || pin === "visitor") {
        let role = "VISITOR";
        if(pin === "990055") role = "ADMINISTRATOR";
        if(pin === "0000") role = "MEMBER";

        // Simpan sesi login & pindah ke halaman dashboard
        sessionStorage.setItem('alightRole', role);
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('pinErrorModal').style.display = 'flex';
      }
    }

    function closeModal() {
      document.getElementById('pinErrorModal').style.display = 'none';
    }
  </script>
</body>
</html>
