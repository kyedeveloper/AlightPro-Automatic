<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alight Pro Hub | Tools</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    :root { --bg-color: #020617; --card-bg: rgba(15, 23, 42, 0.75); --primary: #00ff88; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1); --sidebar-width: 270px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; min-height: 100vh; background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%); background-attachment: fixed; }
    
    .sys-topbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
    .sys-title { font-size: 16px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .sys-sidebar { position: fixed; top: 0; left: -100%; width: var(--sidebar-width); height: 100vh; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-right: 1px solid var(--border); z-index: 9999; padding-top: 85px; transition: left 0.4s; }
    .sys-sidebar.active { left: 0; }
    .nav-item { padding: 16px 24px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border-left: 4px solid transparent; }
    .nav-item:hover, .nav-item.active { background: rgba(0, 255, 136, 0.08); border-left-color: var(--primary); color: var(--primary); }
    .sys-content { padding: 95px 20px 40px; max-width: 650px; margin: 0 auto; }
    .floating-fab { position: fixed; bottom: 25px; left: 20px; width: 55px; height: 55px; background: var(--primary); color: #000; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; z-index: 9998; display: flex; align-items: center; justify-content: center; }
    
    .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .glass-card h3 { font-size: 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .glass-card h3 i { color: var(--primary); }
    
    .modern-input { width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 14px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: #fff; font-size: 15px; outline: none; }
    .modern-btn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: #000; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; text-decoration: none; }
    .modern-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* MODAL KHUSUS HASIL EKSTRAK MEDIA */
    #resultModal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px); display: none; justify-content: center; align-items: center; z-index: 100000; padding: 20px; }
    .result-box { background: #0f172a; border: 1px solid rgba(0, 255, 136, 0.4); border-radius: 22px; padding: 25px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.9); animation: zoomIn 0.3s ease; }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <audio id="bgAudio" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

  <!-- WINDOW / MODAL POPUP HASIL DOWNLOAD -->
  <div id="resultModal">
    <div class="result-box">
      <div style="width: 50px; height: 50px; margin: 0 auto 15px; background: rgba(0,255,136,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--primary);">
        <i class="fa-solid fa-circle-check" style="font-size: 24px; color: var(--primary);"></i>
      </div>
      <h3 style="color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 8px;">Media Berhasil Diekstrak!</h3>
      <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 20px;">File media kamu sudah siap untuk diputar atau diunduh ke perangkat.</p>
      
      <!-- Tombol Aksi -->
      <a id="downloadLinkBtn" href="#" target="_blank" class="modern-btn" style="margin-bottom: 12px;">
        <i class="fa-solid fa-download"></i> UNDUH SEKARANG
      </a>
      <button class="modern-btn" style="background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border); box-shadow: none;" onclick="closeResultModal()">Tutup Jendela</button>
    </div>
  </div>

  <header class="sys-topbar">
    <div class="sys-title">Alight Pro Dashboard</div>
    <button onclick="toggleAudio()" style="background:none; border:none; color:var(--primary); font-size:18px; cursor:pointer;"><i class="fa-solid fa-volume-high" id="audioIcon"></i></button>
  </header>

  <button class="floating-fab" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

  <nav class="sys-sidebar" id="sysSidebar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="generate.html" class="nav-item"><i class="fa-solid fa-crown"></i> Generate Premium</a>
    <a href="tools.html" class="nav-item active"><i class="fa-solid fa-toolbox"></i> Extractor Tools</a>
    <a href="dev.html" class="nav-item"><i class="fa-solid fa-code"></i> Developer Matrix</a>
    <div class="nav-item" onclick="executeLogout()" style="margin-top: 40px; color: #ff3366;"><i class="fa-solid fa-power-off"></i> Keluar Sistem</div>
  </nav>

  <main class="sys-content">
    <div class="glass-card">
      <h3><i class="fa-solid fa-cloud-arrow-down"></i> Universal Downloader Core</h3>
      <select id="dlPlatform" class="modern-input" style="appearance: none;">
        <option value="tiktok_video">TikTok Engine (MP4)</option>
        <option value="tiktok_audio">TikTok Engine (MP3)</option>
        <option value="youtube_video">YouTube Engine (MP4)</option>
        <option value="youtube_audio">YouTube Engine (MP3)</option>
      </select>
      <input type="text" id="dlUrl" class="modern-input" placeholder="Paste URL Source di sini...">
      <button id="dlBtn" class="modern-btn" onclick="apiDownloadMedia()"><i class="fa-solid fa-download"></i> Eksekusi Tautan Media</button>
    </div>
  </main>

  <script>
    let activeRole = sessionStorage.getItem('alightRole');
    if (!activeRole) window.location.replace('index.html');
    if (activeRole === "VISITOR") {
      alert("Akses Ditolak! Harus memiliki role diatas visitor.");
      window.location.replace('home.html');
    }

    function toggleSidebar() { document.getElementById('sysSidebar').classList.toggle('active'); }
    function executeLogout() { sessionStorage.clear(); window.location.href = 'index.html'; }
    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      if(audio.paused) { audio.play(); document.getElementById('audioIcon').className="fa-solid fa-volume-high"; }
      else { audio.pause(); document.getElementById('audioIcon').className="fa-solid fa-volume-xmark"; }
    }

    function closeResultModal() {
      document.getElementById('resultModal').style.display = 'none';
    }

    async function apiDownloadMedia() {
      const plat = document.getElementById('dlPlatform').value;
      const url = document.getElementById('dlUrl').value.trim();
      const btn = document.getElementById('dlBtn');

      if (!url) return alert("Masukkan link target terlebih dahulu!");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Sedang Mengekstrak...`;

      try {
        const res = await fetch('/api/download', { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ platform: plat, url }) 
        });
        
        const data = await res.json();
        
        if (!res.ok || !data.status) {
          throw new Error(data.error || "Gagal mengambil tautan unduhan.");
        }

        // Tampilkan Jendela/Modal khusus hasil unduhan
        document.getElementById('downloadLinkBtn').href = data.downloadUrl;
        document.getElementById('resultModal').style.display = 'flex';

      } catch (e) {
        alert("Gagal: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-download"></i> Eksekusi Tautan Media`;
      }
    }
  </script>
</body>
  </html>
