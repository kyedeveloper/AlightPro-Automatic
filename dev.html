<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alight Pro Hub | Developer Matrix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --bg-color: #020617; --card-bg: rgba(15, 23, 42, 0.75); --primary: #00ff88; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1); --sidebar-width: 270px; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; background-image: radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%); background-attachment: fixed; }
    .sys-topbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
    .sys-title { font-size: 15px; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    .sys-sidebar { position: fixed; top: 0; left: -100%; width: var(--sidebar-width); height: 100vh; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-right: 1px solid var(--border); z-index: 9999; padding-top: 85px; transition: left 0.4s; }
    .sys-sidebar.active { left: 0; }
    .nav-item { padding: 15px 24px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border-left: 4px solid transparent; }
    .nav-item:hover, .nav-item.active { background: rgba(0, 255, 136, 0.08); border-left-color: var(--primary); color: var(--primary); }
    .sys-content { padding: 95px 20px 40px; max-width: 650px; margin: 0 auto; }
    .floating-fab { position: fixed; bottom: 25px; left: 20px; width: 55px; height: 55px; background: var(--primary); color: #000; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; z-index: 9998; display: flex; align-items: center; justify-content: center; }
    .glass-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(10px); }
  </style>
</head>
<body>
  <audio id="bgAudio" loop><source src="lagu.mp3" type="audio/mpeg"></audio>
  <header class="sys-topbar">
    <div class="sys-title">Developer Matrix</div>
    <button onclick="toggleAudio()" style="background:none; border:none; color:var(--primary); font-size:18px; cursor:pointer;"><i class="fa-solid fa-volume-high" id="audioIcon"></i></button>
  </header>
  <button class="floating-fab" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
  <nav class="sys-sidebar" id="sysSidebar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="generate.html" class="nav-item"><i class="fa-solid fa-crown"></i> Generate Premium</a>
    <a href="tools.html" class="nav-item"><i class="fa-solid fa-toolbox"></i> Extractor Tools</a>
    <a href="dev.html" class="nav-item active"><i class="fa-solid fa-code"></i> Developer Matrix</a>
    <a href="ai.html" class="nav-item"><i class="fa-solid fa-brain"></i> AI Command Matrix</a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> System Settings</a>
    <div class="nav-item" onclick="executeLogout()" style="margin-top: 20px; color: #ff3366;"><i class="fa-solid fa-power-off"></i> Keluar Sistem</div>
  </nav>
  <main class="sys-content">
    <div class="glass-card">
      <h3 style="margin-bottom: 15px; font-weight: 800;"><i class="fa-solid fa-terminal" style="color:var(--primary);"></i> Developer Diagnostics</h3>
      <p style="color: var(--text-muted); font-size: 13px; line-height: 1.6;">Area khusus pengujian modul script sistem inti Vercel dan lingkungan arsitektur JavaScript runtime.</p>
    </div>
  </main>
  <script>
    let role = sessionStorage.getItem('alightRole');
    if (!role) window.location.replace('index.html');
    function toggleSidebar() { document.getElementById('sysSidebar').classList.toggle('active'); }
    function executeLogout() { sessionStorage.clear(); window.location.href = 'index.html'; }
    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      if(audio.paused) { audio.play().catch(e=>{}); document.getElementById('audioIcon').className="fa-solid fa-volume-high"; }
      else { audio.pause(); document.getElementById('audioIcon').className="fa-solid fa-volume-xmark"; }
    }
  </script>
</body>
</html>
