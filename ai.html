<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alight Pro Hub | AI Assistant</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">

  <style>
    :root { 
      --bg-color: #020617; 
      --card-bg: rgba(15, 23, 42, 0.75); 
      --primary: #00ff88; 
      --text-main: #f8fafc; 
      --text-muted: #94a3b8; 
      --border: rgba(255, 255, 255, 0.1); 
      --sidebar-width: 270px; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      overflow-x: hidden; 
      height: 100vh; 
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%), 
        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%); 
      background-attachment: fixed; 
    }

    .sys-topbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; }
    .sys-title { font-size: 15px; font-weight: 800; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }
    
    /* DROPDOWN PEMILIH MODEL AI DI TOPBAR */
    .ai-model-select {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .sys-sidebar { position: fixed; top: 0; left: -100%; width: var(--sidebar-width); height: 100vh; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-right: 1px solid var(--border); z-index: 9999; padding-top: 85px; transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
    .sys-sidebar.active { left: 0; }
    
    .nav-item { padding: 16px 24px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.3s; border-left: 4px solid transparent; }
    .nav-item:hover, .nav-item.active { background: rgba(255, 255, 255, 0.05); border-left-color: var(--primary); color: var(--primary); }
    
    .floating-fab { position: fixed; bottom: 85px; left: 20px; width: 55px; height: 55px; background: var(--primary); color: #000; border-radius: 50%; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.4); z-index: 9998; display: flex; align-items: center; justify-content: center; }

    .chat-container { 
      flex: 1; 
      margin-top: 70px; 
      margin-bottom: 75px; 
      padding: 20px; 
      overflow-y: auto; 
      max-width: 700px; 
      width: 100%; 
      margin-left: auto; 
      margin-right: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .chat-bubble.ai {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      align-self: flex-start;
      border-top-left-radius: 4px;
    }

    .chat-bubble.user {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      align-self: flex-end;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,255,136,0.2);
    }

    .chat-input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid var(--border);
      padding: 15px 20px;
      display: flex;
      gap: 10px;
      z-index: 997;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .chat-input:focus { border-color: var(--primary); }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--primary);
      color: #000;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .send-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <audio id="bgAudio" loop><source src="lagu.mp3" type="audio/mpeg"></audio>

  <header class="sys-topbar">
    <div class="sys-title">AI Matrix</div>
    <!-- Opsi Pemilihan Model AI -->
    <select id="aiModelSelect" class="ai-model-select">
      <option value="chatgpt">ChatGPT (OpenAI)</option>
      <option value="gemini">Google Gemini</option>
      <option value="deepseek">DeepSeek / Groq</option>
    </select>
    <button onclick="toggleAudio()" style="background:none; border:none; color:var(--primary); font-size:18px; cursor:pointer;"><i class="fa-solid fa-volume-high" id="audioIcon"></i></button>
  </header>

  <button class="floating-fab" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>

  <nav class="sys-sidebar" id="sysSidebar">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="generate.html" class="nav-item"><i class="fa-solid fa-crown"></i> Generate Premium</a>
    <a href="tools.html" class="nav-item"><i class="fa-solid fa-toolbox"></i> Extractor Tools</a>
    <a href="dev.html" class="nav-item"><i class="fa-solid fa-code"></i> Developer Matrix</a>
    <a href="ai.html" class="nav-item active"><i class="fa-solid fa-brain"></i> AI Command Matrix</a>
    <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> System Settings</a>
    <div class="nav-item" onclick="executeLogout()" style="margin-top: 30px; color: #ff3366;"><i class="fa-solid fa-power-off"></i> Keluar Sistem</div>
  </nav>

  <div class="chat-container" id="chatContainer">
    <div class="chat-bubble ai">
      <strong>[SYSTEM AI]:</strong> Pilih model AI di bagian atas (ChatGPT, Gemini, atau DeepSeek), lalu tanyakan apa saja ke saya!
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan..." autocomplete="off">
    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    let role = sessionStorage.getItem('alightRole');
    if (!role) window.location.replace('index.html');

    function toggleSidebar() { document.getElementById('sysSidebar').classList.toggle('active'); }
    function executeLogout() { sessionStorage.clear(); window.location.href = 'index.html'; }

    function toggleAudio() {
      const audio = document.getElementById('bgAudio');
      const icon = document.getElementById('audioIcon');
      if(audio.paused) { audio.play().catch(e=>{}); icon.className = "fa-solid fa-volume-high"; }
      else { audio.pause(); icon.className = "fa-solid fa-volume-xmark"; }
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      const selectedModel = document.getElementById('aiModelSelect').value;
      if (!text) return;

      const container = document.getElementById('chatContainer');

      // Tampilkan pesan User
      const userBubble = document.createElement('div');
      userBubble.className = 'chat-bubble user';
      userBubble.innerText = text;
      container.appendChild(userBubble);
      
      input.value = '';
      container.scrollTop = container.scrollHeight;

      // Bubble Loading AI
      const aiBubble = document.createElement('div');
      aiBubble.className = 'chat-bubble ai';
      aiBubble.innerHTML = `<strong>[${selectedModel.toUpperCase()}]:</strong> <i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke API...`;
      container.appendChild(aiBubble);
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, model: selectedModel })
        });

        const data = await response.json();
        if (data.status && data.reply) {
          aiBubble.innerHTML = `<strong>[${selectedModel.toUpperCase()}]</strong><br>${data.reply}`;
        } else {
          aiBubble.innerHTML = `<strong>[ERROR]:</strong> ${data.error || "Gagal mendapatkan respons."}<br><small style="color:#ffb703;">${data.fallback || ""}</small>`;
        }
      } catch (err) {
        aiBubble.innerHTML = `<strong>[SYSTEM]:</strong> Gagal menghubungi server backend API.`;
      }
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById("chatInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
